name: Persist policy stock mapping

on:
  push:
    branches: [main]
    paths:
      - 'inject_policy_stock_map.py'
      - 'policy_stock_map.py'
      - '.github/workflows/persist-policy-stock-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-entry-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Persist mapping in Streamlit entry files
        run: python inject_policy_stock_map.py

      - name: Validate syntax
        run: |
          python -m py_compile app.py
          python -m py_compile app_v4_professional.py
          python -m py_compile app_v5_rotation_map.py
          python -m py_compile app_upgraded.py
          python -m py_compile policy_stock_map.py

      - name: Commit patched entry files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py app_v4_professional.py app_v5_rotation_map.py app_upgraded.py
          if git diff --cached --quiet; then
            echo 'No patch needed; mapping is already persisted.'
          else
            git commit -m 'Persist policy stock mapping in Streamlit entry files'
            git push origin HEAD:main
          fi

name: Fix long metric cards

on:
  push:
    branches: [main]
    paths:
      - 'fix_long_metric_cards.py'
      - '.github/workflows/fix-long-metric-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch long text metric cards
        run: python fix_long_metric_cards.py
      - name: Validate syntax
        run: |
          python -m py_compile pages/1_Professional_Research_Lab.py
          python -m py_compile pages/3_Decision_Engine.py
          python -m py_compile pages/4_VALUE_Stock_Engine.py
      - name: Commit patched pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/1_Professional_Research_Lab.py pages/3_Decision_Engine.py pages/4_VALUE_Stock_Engine.py
          if git diff --cached --quiet; then
            echo 'Long metric cards already fixed.'
          else
            git commit -m 'Replace truncated long metrics with responsive text cards'
            git push origin HEAD:main
          fi
